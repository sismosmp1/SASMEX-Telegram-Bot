services:
  - type: web
    name: sasmex-telegram-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: CHAT_ID
        sync: false
      - key: CHECK_SECONDS
        value: "15"
      - key: SASMEX_URL
        value: "https://rss.sasmex.net/"
